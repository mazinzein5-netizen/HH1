kind = "video"
previewPath = "/surgical-video/"
title = "HIVE Surgical Assistant Video"
version = "1.0.0"
id = "artifacts/surgical-video"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/surgical-video/" ]
localPort = 24063

[services.development]
run = "pnpm --filter @workspace/surgical-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/surgical-video", "run", "build" ]
publicDir = "artifacts/surgical-video/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24063"
BASE_PATH = "/surgical-video/"
