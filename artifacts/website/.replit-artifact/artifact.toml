kind = "web"
previewPath = "/"
title = "Health HIVE Ecosystem Website"
version = "1.0.0"
id = "artifacts/website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19161

[services.development]
run = "pnpm --filter @workspace/website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/website", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/website", "run", "serve" ]

[services.env]
PORT = "19161"
BASE_PATH = "/"
