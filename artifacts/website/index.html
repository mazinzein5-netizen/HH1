<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- @ROUTE_META@ -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      (function() {
        try {
          var override = new URLSearchParams(window.location.search).get('theme');
          if (override === 'dark' || override === 'light') {
            localStorage.setItem('theme', override);
          }
          var theme = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (theme === 'dark' || ((!theme || theme === 'system') && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <!-- Scroll-World Engine + HIVE Config (vanilla JS, loaded before React mounts) -->
    <script src="/scrub-engine.js"></script>
    <script src="/hive-scroll-config.js"></script>
  </head>
  <body>
    <div id="root"><!-- @ROUTE_BODY@ --></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
